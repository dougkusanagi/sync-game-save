<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Progresso da migração para Wails</title><style>
body{margin:0;color:var(--foreground,#202124);font:14px var(--font-sans,system-ui)}h1{font-size:19px;margin:0 0 8px}p{margin:0;color:var(--muted-foreground,#555);line-height:1.5}.summary{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin:18px 0 12px}.track{display:flex;gap:2px;width:100%;height:36px}.segment{position:relative;display:block;min-width:0;padding:0;border:0;background:color-mix(in srgb, var(--color) 35%, var(--secondary,#dedede));cursor:pointer}.segment:first-child{border-radius:6px 0 0 6px;overflow:hidden}.segment:last-child{border-radius:0 6px 6px 0;overflow:hidden}.segment:focus-visible{outline:2px solid var(--ring,#234db5);outline-offset:3px;z-index:1}.completed{position:absolute;inset:0 auto 0 0;background:var(--color);pointer-events:none}.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 18px;margin-top:18px}.legend-item{display:flex;align-items:center;gap:8px;min-width:0;color:var(--foreground,#202124)}.dot{width:11px;height:11px;border-radius:3px;background:var(--color);flex:none}.legend-item button{color:inherit;font:inherit;text-align:left;border:0;padding:3px 0;background:none;cursor:pointer}.legend-item button:focus-visible{outline:2px solid var(--ring,#234db5);outline-offset:3px}.detail{display:none;margin-top:16px;padding:12px 14px;border-radius:var(--radius,8px);background:var(--popover,#f0f0f0);color:var(--popover-foreground,#202124);line-height:1.45}.detail.visible{display:block}.detail strong{display:block;margin-bottom:4px}.note{font-size:12px;margin-top:16px}.segment:hover,.legend-item button:hover{filter:brightness(1.15)}
</style></head><body><h1>Migração para Wails</h1><p>Itens concluídos nas etapas do plano</p><div class="summary"><strong>Progresso geral</strong><strong id="total"></strong></div><div class="track" id="track" aria-label="Etapas da migração"></div><div class="legend" id="legend" aria-label="Legenda das etapas"></div><div id="detail" class="detail" role="tooltip" aria-live="polite"></div><p class="note">Cada trecho representa a quantidade de itens da etapa; a cor preenchida mostra os concluídos. Os itens têm tamanhos diferentes e não estimam o tempo restante.</p><script>
const stages=[
 {name:'0 · Medir a base',done:2,total:2,color:'var(--chart-1,#5585ff)',detail:'Medição do Tauri concluída; o instalador do Tauri não foi medido.'},
 {name:'1 · Prova de conceito',done:4,total:4,color:'var(--chart-2,#43b8a2)',detail:'Wails escolhido e builds gerados; bandeja, fechar para a bandeja e restauração pelo clique conferidos no Windows.'},
 {name:'2 · Núcleo',done:23,total:23,color:'var(--chart-3,#e39b48)',detail:'Sync, descoberta, acompanhamento, paradas e testes com processos e janelas reais portados e testados no Windows e no Linux, com detector de corrida.'},
 {name:'3 · Catálogo e serviços',done:11,total:11,color:'var(--chart-4,#bc78e6)',detail:'Biblioteca, catálogo, conquistas e serviços portados, com os dados do Rust lidos e gravados sem perda.'},
 {name:'4 · CLI',done:1,total:1,color:'var(--chart-5,#e76885)',detail:'Comando sgs portado, com os mesmos comandos, saídas e códigos de retorno.'},
 {name:'5 · App Wails',done:6,total:6,color:'var(--chart-6,#54a9dd)',detail:'Comandos, eventos, bandeja, notificações, capas e controle (Windows e Linux) prontos.'},
 {name:'6 · Frontend',done:16,total:16,color:'var(--chart-7,#d6c04b)',detail:'Todos os comandos, o atualizador e os E2E no app real ligados aos serviços Go.'},
 {name:'7 · Distribuição',done:4,total:4,color:'var(--chart-8,#d78160)',detail:'Release 2.0.1 publicado; atualizador Go e ponte testados com um Tauri 1.1.0 real. Resta abrir o AppImage num Ubuntu real.'},
 {name:'8 · Remoção e documentação',done:6,total:6,color:'var(--chart-9,#8291b9)',detail:'Tauri removido, documentação atualizada e versão 2.0.0 lançada.'}
];
const track=document.getElementById('track'),legend=document.getElementById('legend'),detail=document.getElementById('detail');
const total=stages.reduce((n,s)=>n+s.total,0),done=stages.reduce((n,s)=>n+s.done,0);
document.getElementById('total').textContent=`${done} de ${total} · ${Math.round(done/total*100)}%`;
function show(s){detail.replaceChildren();const title=document.createElement('strong');title.textContent=`${s.name} · ${s.done} de ${s.total}`;detail.append(title,document.createTextNode(s.detail));detail.classList.add('visible')}
function hide(){detail.classList.remove('visible')}
function bind(el,s){el.addEventListener('mouseenter',()=>show(s));el.addEventListener('mouseleave',hide);el.addEventListener('focus',()=>show(s));el.addEventListener('blur',hide);el.setAttribute('aria-describedby','detail')}
for(const s of stages){const segment=document.createElement('button');segment.type='button';segment.className='segment';segment.style.flex=`${s.total} 1 0`;segment.style.setProperty('--color',s.color);segment.setAttribute('aria-label',`${s.name}: ${s.done} de ${s.total} itens concluídos`);const fill=document.createElement('span');fill.className='completed';fill.style.width=`${s.done/s.total*100}%`;segment.append(fill);bind(segment,s);track.append(segment);const item=document.createElement('div');item.className='legend-item';item.style.setProperty('--color',s.color);const dot=document.createElement('span');dot.className='dot';dot.setAttribute('aria-hidden','true');const label=document.createElement('button');label.type='button';label.textContent=s.name;bind(label,s);item.append(dot,label);legend.append(item)}
</script></body></html>
