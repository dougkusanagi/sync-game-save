[workspace]
resolver = "2"
members = [".", "crates/sgs-core", "crates/sgs-catalog", "crates/sgs-cli", "crates/sgs-library"]

[package]
name = "sync-game-save"
version = "0.1.0"
description = "Launcher de jogos com sincronização segura de saves"
edition = "2024"

[lib]
name = "sync_game_save_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
sgs-core = { path = "crates/sgs-core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
